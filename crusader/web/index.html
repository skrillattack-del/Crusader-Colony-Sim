<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crusader Colony Sim</title>
<style>
  :root { --bg:#0d1420; --panel:#16202e; --fg:#dfe6e9; --dim:#8b9bab; --acc:#e17055; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.4 "Segoe UI", system-ui, sans-serif; display:flex; height:100vh; }
  #mapwrap { flex:1; display:flex; align-items:center; justify-content:center;
             position:relative; overflow:hidden; }
  canvas { image-rendering:pixelated; background:#101820; cursor:crosshair;
           max-width:100%; max-height:100vh; }
  #side { width:340px; background:var(--panel); display:flex; flex-direction:column;
          border-left:1px solid #243244; }
  #stats { padding:12px; white-space:pre-line; font-family:Consolas,monospace;
           font-size:12px; border-bottom:1px solid #243244; color:var(--fg); }
  #controls { padding:8px 12px; display:flex; flex-wrap:wrap; gap:6px;
              border-bottom:1px solid #243244; }
  button { background:#223248; color:var(--fg); border:1px solid #31465f;
           border-radius:4px; padding:4px 10px; cursor:pointer; font-size:12px; }
  button:hover { background:#2d4059; }
  button.active { background:var(--acc); border-color:var(--acc); color:#fff; }
  #prov { padding:10px 12px; font-size:12px; color:var(--dim); min-height:70px;
          border-bottom:1px solid #243244; white-space:pre-line; }
  #chron { flex:1; overflow-y:auto; padding:10px 12px; font-family:Consolas,monospace;
           font-size:11px; color:#b2bec3; }
  #chron div { margin-bottom:3px; }
  h1 { font-size:15px; margin:0; padding:12px 12px 4px; color:var(--acc);
       letter-spacing:1px; }
</style>
</head>
<body>
<div id="mapwrap"><canvas id="map" width="192" height="192"></canvas></div>
<div id="side">
  <h1>⚔ CRUSADER COLONY SIM</h1>
  <div id="stats">connecting…</div>
  <div id="controls">
    <button data-mode="biome" class="active">Biome</button>
    <button data-mode="realm">Realm</button>
    <button data-mode="faith">Faith</button>
    <button data-mode="economy">Economy</button>
    <span style="flex-basis:100%"></span>
    <button id="pause">⏸ Pause</button>
    <button id="slower">−</button>
    <button id="faster">+</button>
    <button id="dlg">💬 Dialogue</button>
  </div>
  <div id="prov">click the map to inspect a province</div>
  <div id="chron"></div>
</div>
<script>
const cv = document.getElementById('map');
const ctx = cv.getContext('2d');
let mode = 'biome', W = 192, H = 192, scale = 4;
let chronTotal = 0;

function b64toBytes(b64) {
  const s = atob(b64), a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

async function loadMap() {
  const r = await fetch('/api/map?mode=' + mode);
  const m = await r.json();
  W = m.w; H = m.h;
  cv.width = W; cv.height = H;
  const fit = Math.min(window.innerWidth - 340, window.innerHeight);
  cv.style.width = fit + 'px'; cv.style.height = fit + 'px';
  const tiles = b64toBytes(m.tiles);
  const img = ctx.createImageData(W, H);
  for (let i = 0; i < tiles.length; i++) {
    const hex = m.palette[tiles[i]];
    img.data[i*4]   = parseInt(hex.slice(1,3), 16);
    img.data[i*4+1] = parseInt(hex.slice(3,5), 16);
    img.data[i*4+2] = parseInt(hex.slice(5,7), 16);
    img.data[i*4+3] = 255;
  }
  ctx.putImageData(img, 0, 0);
}

async function loadOverlays() {
  const r = await fetch('/api/overlays');
  const o = await r.json();
  await loadMap();  // redraw base, then overlays
  for (const c of o.capitals) {
    ctx.fillStyle = '#fff';
    ctx.font = '6px serif';
    ctx.fillText('👑', c.x - 3, c.y + 2);
  }
  for (const s of o.sieges) {
    ctx.strokeStyle = '#e17055'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = '#fdcb6e';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 4, -1.57, -1.57 + 6.283 * s.pct); ctx.stroke();
  }
  for (const a of o.armies) {
    ctx.fillStyle = a.side === 'attacker' ? '#ff6b6b' : '#74b9ff';
    ctx.beginPath();
    ctx.moveTo(a.x, a.y - 3); ctx.lineTo(a.x + 3, a.y + 2);
    ctx.lineTo(a.x - 3, a.y + 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '4px monospace';
    ctx.fillText(a.size, a.x - 4, a.y - 4);
  }
}

async function loadState() {
  const r = await fetch('/api/state');
  const s = await r.json();
  const faiths = Object.entries(s.faiths).map(([k,v]) => k+':'+v).join('  ');
  document.getElementById('stats').textContent =
    `${s.date}   ${s.paused ? '⏸ paused' : '▶ ' + s.days_per_sec + ' days/s'}\n` +
    `Pawns: ${s.living_pawns}  (+${s.births} / −${s.deaths})\n` +
    `Kingdoms: ${s.kingdoms}   Wars: ${s.active_wars} active / ${s.total_wars} total\n` +
    `Faiths: ${faiths}\n` +
    `Innovations: ${s.innovations_known_all_realms}  Techniques: ${s.techniques_total}\n` +
    `Recipes: ${s.recipes_total}   LLM: ${s.llm_online ? 'online' : 'offline'}`;
  document.getElementById('pause').textContent = s.paused ? '▶ Resume' : '⏸ Pause';
}

async function loadChronicle() {
  const r = await fetch('/api/chronicle?since=' + chronTotal);
  const c = await r.json();
  if (!c.entries.length) return;
  chronTotal = c.total;
  const box = document.getElementById('chron');
  for (const e of c.entries) {
    const d = document.createElement('div');
    d.textContent = e;
    box.appendChild(d);
  }
  while (box.children.length > 400) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

cv.addEventListener('click', async (ev) => {
  const rect = cv.getBoundingClientRect();
  const x = Math.floor((ev.clientX - rect.left) / rect.width * W);
  const y = Math.floor((ev.clientY - rect.top) / rect.height * H);
  const r = await fetch(`/api/province_xy?x=${x}&y=${y}`);
  if (!r.ok) return;
  const p = await r.json();
  if (!p || p.error) return;
  const goods = Object.entries(p.goods||{}).map(([g,v])=>`${g} ${v}`).join(', ');
  document.getElementById('prov').textContent =
    `${p.name} — ${p.biome}\nholding: ${p.holding} (fort ${p.fort}), dev ${p.development}\n` +
    `pop: ${p.population}   ruler: ${p.ruler || 'none'}\n` +
    `goods: ${goods || '—'}\nbuildings: ${(p.buildings||[]).join(', ') || '—'}`;
});

document.querySelectorAll('button[data-mode]').forEach(b => {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll('button[data-mode]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    loadOverlays();
  };
});
document.getElementById('pause').onclick = async () => {
  const s = await (await fetch('/api/state')).json();
  await fetch('/api/control', {method:'POST',
    body: JSON.stringify({action: s.paused ? 'resume' : 'pause'})});
  loadState();
};
document.getElementById('faster').onclick = async () => {
  const s = await (await fetch('/api/state')).json();
  await fetch('/api/control', {method:'POST',
    body: JSON.stringify({action:'speed', value: Math.min(120, s.days_per_sec * 1.5)})});
  loadState();
};
document.getElementById('slower').onclick = async () => {
  const s = await (await fetch('/api/state')).json();
  await fetch('/api/control', {method:'POST',
    body: JSON.stringify({action:'speed', value: Math.max(1, s.days_per_sec / 1.5)})});
  loadState();
};
document.getElementById('dlg').onclick = async () => {
  const r = await fetch('/api/dialogue');
  const d = await r.json();
  const box = document.getElementById('chron');
  for (const line of ['—— conversation ——', ...d.lines]) {
    const el = document.createElement('div');
    el.textContent = line;
    box.appendChild(el);
  }
  box.scrollTop = box.scrollHeight;
};

loadOverlays(); loadState(); loadChronicle();
setInterval(loadOverlays, 2000);
setInterval(loadState, 2000);
setInterval(loadChronicle, 1500);
</script>
</body>
</html>
