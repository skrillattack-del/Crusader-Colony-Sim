<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crusader Colony Sim</title>
<style>
  :root { --bg:#0d1420; --panel:#16202e; --fg:#dfe6e9; --dim:#8b9bab; --acc:#e17055; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.4 "Segoe UI", system-ui, sans-serif; display:flex; height:100vh; }
  #mapwrap { flex:1; display:flex; align-items:center; justify-content:center;
             position:relative; overflow:hidden; }
  canvas { image-rendering:pixelated; background:#101820; cursor:crosshair;
           max-width:100%; max-height:100vh; }
  #side { width:360px; background:var(--panel); display:flex; flex-direction:column;
          border-left:1px solid #243244; }
  #stats { padding:12px; white-space:pre-line; font-family:Consolas,monospace;
           font-size:12px; border-bottom:1px solid #243244; }
  #controls { padding:8px 12px; display:flex; flex-wrap:wrap; gap:6px;
              border-bottom:1px solid #243244; }
  button { background:#223248; color:var(--fg); border:1px solid #31465f;
           border-radius:4px; padding:4px 10px; cursor:pointer; font-size:12px; }
  button:hover { background:#2d4059; }
  button.active { background:var(--acc); border-color:var(--acc); color:#fff; }
  #inspector { max-height:44vh; overflow-y:auto; border-bottom:1px solid #243244; }
  #prov { padding:10px 12px; font-size:12px; color:var(--dim); white-space:pre-line; }
  .pawnrow { padding:4px 12px; font-size:12px; cursor:pointer; color:var(--fg); }
  .pawnrow:hover { background:#223248; }
  .pawnrow .tag { color:var(--dim); font-size:11px; }
  #pawn { padding:10px 12px; font-size:12px; white-space:pre-line;
          color:var(--fg); display:none; }
  #pawn b { color:var(--acc); }
  #chron { flex:1; overflow-y:auto; padding:10px 12px; font-family:Consolas,monospace;
           font-size:11px; color:#b2bec3; }
  #chron div { margin-bottom:3px; }
  h1 { font-size:15px; margin:0; padding:12px 12px 4px; color:var(--acc);
       letter-spacing:1px; }
  /* ---- Total War battle viewer ---- */
  #battlewrap { display:none; position:absolute; inset:2%; background:#0a0f16;
                border:1px solid #31465f; border-radius:8px; z-index:10;
                flex-direction:column; padding:10px; }
  #battlehead { display:flex; align-items:center; gap:14px; color:var(--fg);
                font-size:13px; padding-bottom:8px; }
  #battlehead .side { display:flex; align-items:center; gap:6px; flex:1; }
  #battlehead .side:last-of-type { flex-direction:row-reverse; text-align:right; }
  .mbar { flex:1; height:10px; background:#223248; border-radius:5px; overflow:hidden; }
  .mbar > div { height:100%; transition:width .3s; }
  .mbar > div.mflash { animation: mflash 0.45s; }
  @keyframes mflash {
    0% { filter: brightness(1); }
    15% { filter: brightness(2.2); }
    100% { filter: brightness(1); }
  }
  #bcanvas { flex:1; background:#1c2b1e; border-radius:6px; width:100%; }
  #battlefoot { display:flex; gap:12px; padding-top:8px; }
  #killfeed { flex:1; height:108px; overflow-y:auto; font-family:Consolas,monospace;
              font-size:11px; color:#b2bec3; }
  #bresult { font-size:15px; color:#f1c40f; align-self:center; }
  #bclose { align-self:flex-start; }
</style>
</head>
<body>
<div id="mapwrap"><canvas id="map" width="192" height="192"></canvas>
  <div id="battlewrap">
    <div id="battlehead">
      <div class="side"><b id="s0name" style="color:#ff6b6b"></b>
        <div class="mbar"><div id="s0morale" style="background:#ff6b6b"></div></div>
        <span id="s0count"></span></div>
      <button id="bclose">✕ close</button>
      <div class="side"><b id="s1name" style="color:#74b9ff"></b>
        <div class="mbar"><div id="s1morale" style="background:#74b9ff"></div></div>
        <span id="s1count"></span></div>
    </div>
    <canvas id="bcanvas" width="960" height="560"></canvas>
    <div id="battlefoot">
      <div id="killfeed"></div>
      <div id="bresult"></div>
    </div>
  </div>
</div>
<div id="side">
  <h1>⚔ CRUSADER COLONY SIM</h1>
  <div id="stats">connecting…</div>
  <div id="controls">
    <button data-mode="biome" class="active">Biome</button>
    <button data-mode="realm">Realm</button>
    <button data-mode="faith">Faith</button>
    <button data-mode="economy">Economy</button>
    <span style="flex-basis:100%"></span>
    <button id="pause">⏸ Pause</button>
    <button id="slower">−</button>
    <button id="faster">+</button>
    <button id="dlg">💬 Dialogue</button>
    <button id="watch">⚔ Watch <span id="bcount">0</span></button>
    <button id="stage">⚡ Stage battle</button>
  </div>
  <div id="inspector">
    <div id="prov">click the map to inspect a province</div>
    <div id="pawnlist"></div>
    <div id="pawn"></div>
  </div>
  <div id="chron"></div>
</div>
<script>
const cv = document.getElementById('map');
const ctx = cv.getContext('2d');
let mode = 'biome', W = 192, H = 192;
let chronTotal = 0;

// ---- map animation state ----
let baseImg = null;             // static tile ImageData
let frameImg = null;            // working frame ImageData for water shimmer
let tileBytes = null;           // decoded tile indices
let lastPalette = [];           // palette from last /api/map
let waterMask = new Set();      // indices that are ocean / deep_ocean / river
let coastSet = new Set();       // water tiles touching land
let mapOverlays = { capitals: [], sieges: [], armies: [], fights: [] };
let clouds = [];
let mapPaused = false;
let mapRaf = null;
const WATER_COLS = new Set(['#2b5d8a', '#1b3a5c', '#3d7fc1']);

function b64toBytes(b64) {
  const s = atob(b64), a = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

function initClouds() {
  if (clouds.length) return;
  for (let i = 0; i < 5; i++) {
    clouds.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: 0.015 + Math.random() * 0.025,
      vy: 0.003 + Math.random() * 0.008,
      rx: 16 + Math.random() * 26, ry: 6 + Math.random() * 10,
      a: 0.04 + Math.random() * 0.04,
      rot: Math.random() * 0.6,
    });
  }
}

function updateClouds() {
  for (const c of clouds) {
    c.x += c.vx; c.y += c.vy;
    if (c.x > W + 60) c.x = -60;
    if (c.y > H + 30) c.y = -30;
  }
}

function drawClouds() {
  for (const c of clouds) {
    ctx.fillStyle = `rgba(205,215,230,${c.a})`;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.rx, c.ry, c.rot, 0, 6.283);
    ctx.fill();
  }
}

function isWaterColor(hex) { return WATER_COLS.has(hex); }

function buildWaterMask() {
  waterMask.clear(); coastSet.clear();
  if (!baseImg || mode !== 'biome') return;
  for (let i = 0; i < W * H; i++) {
    const hex = lastPalette[tileBytes[i]];
    if (isWaterColor(hex)) waterMask.add(i);
  }
  // coast detection: water with a non-water 4-neighbor
  for (const i of waterMask) {
    const x = i % W, y = Math.floor(i / W);
    let coast = false;
    if (x > 0 && !waterMask.has(i - 1)) coast = true;
    if (x < W - 1 && !waterMask.has(i + 1)) coast = true;
    if (y > 0 && !waterMask.has(i - W)) coast = true;
    if (y < H - 1 && !waterMask.has(i + W)) coast = true;
    if (coast) coastSet.add(i);
  }
}

async function loadMap() {
  const r = await fetch('/api/map?mode=' + mode);
  const m = await r.json();
  W = m.w; H = m.h;
  cv.width = W; cv.height = H;
  const fit = Math.min(window.innerWidth - 360, window.innerHeight);
  cv.style.width = fit + 'px'; cv.style.height = fit + 'px';
  tileBytes = b64toBytes(m.tiles);
  lastPalette = m.palette;
  baseImg = ctx.createImageData(W, H);
  for (let i = 0; i < tileBytes.length; i++) {
    const hex = lastPalette[tileBytes[i]];
    baseImg.data[i*4]   = parseInt(hex.slice(1,3), 16);
    baseImg.data[i*4+1] = parseInt(hex.slice(3,5), 16);
    baseImg.data[i*4+2] = parseInt(hex.slice(5,7), 16);
    baseImg.data[i*4+3] = 255;
  }
  buildWaterMask();
  if (!frameImg || frameImg.width !== W || frameImg.height !== H) {
    frameImg = ctx.createImageData(W, H);
  }
  initClouds();
  drawMapFrame(performance.now());
}

function buildFrame(now) {
  if (!frameImg || frameImg.width !== W || frameImg.height !== H) {
    frameImg = ctx.createImageData(W, H);
  }
  frameImg.data.set(baseImg.data);
  if (mode !== 'biome' || waterMask.size === 0) return frameImg;
  const t = now * 0.0015;
  for (const i of waterMask) {
    const o = i * 4, x = i % W, y = Math.floor(i / W);
    const isCoast = coastSet.has(i);
    const isRiver = lastPalette[tileBytes[i]] === '#3d7fc1';
    let shimmer;
    if (isRiver) {
      // flowing along a diagonal, rivers are thin so wave appears to travel
      shimmer = 1 + Math.sin(t * 3.2 - x * 0.25 - y * 0.18) * 0.07;
    } else if (isCoast) {
      shimmer = 1 + Math.sin(t * 2.2 + x * 0.3 + y * 0.2) * 0.09;
    } else {
      shimmer = 1 + Math.sin(t * 0.7 + x * 0.12 + y * 0.08) * 0.04
                + Math.sin(t * 1.4 + x * 0.45) * 0.025;
    }
    // brighten on crest, slight foam on coast
    const foam = isCoast && shimmer > 1.04 ? 18 * (shimmer - 1.04) : 0;
    frameImg.data[o]   = Math.min(255, (baseImg.data[o]   * shimmer) + foam);
    frameImg.data[o+1] = Math.min(255, (baseImg.data[o+1] * shimmer) + foam);
    frameImg.data[o+2] = Math.min(255, (baseImg.data[o+2] * shimmer) + foam);
  }
  return frameImg;
}

function diamond(x, y, r, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r, y);
  ctx.lineTo(x, y + r); ctx.lineTo(x - r, y);
  ctx.fill();
}

function drawMapOverlays(now) {
  const capPulse = 1 + Math.sin(now / 500) * 0.1;
  for (const c of mapOverlays.capitals) {
    diamond(c.x, c.y, 2.6, '#f1c40f');
    ctx.fillStyle = 'rgba(241,196,15,0.18)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 5 * capPulse, 0, 6.283);
    ctx.fill();
  }
  for (const s of mapOverlays.sieges) {
    ctx.strokeStyle = '#e17055'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 6.283); ctx.stroke();
    ctx.strokeStyle = '#fdcb6e';
    ctx.beginPath();
    ctx.arc(s.x, s.y, 4, -1.57, -1.57 + 6.283 * s.pct); ctx.stroke();
    // flickering fire
    const flick = 0.75 + Math.random() * 0.35;
    ctx.fillStyle = `rgba(225,112,85,${0.6 * flick})`;
    ctx.beginPath();
    ctx.moveTo(s.x, s.y - 3);
    ctx.lineTo(s.x + 2, s.y + 1);
    ctx.lineTo(s.x - 2, s.y + 1);
    ctx.fill();
    // rising smoke puffs
    const puff = (now % 1800) / 1800;
    ctx.fillStyle = `rgba(130,140,150,${0.2 * (1 - puff)})`;
    const sx = s.x + Math.sin(now / 400) * 1.2;
    const sy = s.y - 6 - puff * 12;
    ctx.beginPath(); ctx.arc(sx, sy, 2 + puff * 2, 0, 6.283); ctx.fill();
  }
  ctx.font = '4px monospace';
  ctx.textAlign = 'left';
  for (const a of mapOverlays.armies) {
    const bob = Math.sin(now / 350 + a.x) * 0.5;
    ctx.fillStyle = a.side === 'attacker' ? '#ff6b6b' : '#74b9ff';
    ctx.beginPath();
    const ax = a.x, ay = a.y + bob;
    ctx.moveTo(ax, ay - 3); ctx.lineTo(ax + 3, ay + 2); ctx.lineTo(ax - 3, ay + 2); ctx.fill();
    ctx.strokeStyle = '#101820'; ctx.lineWidth = 0.6;
    ctx.strokeText(a.size, ax - 4, ay - 4);
    ctx.fillStyle = '#fff';
    ctx.fillText(a.size, ax - 4, ay - 4);
  }
  // live battles: pulsing crossed marker
  const bPulse = 1 + Math.sin(now / 180) * 0.28;
  for (const f of mapOverlays.fights || []) {
    ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 1.2;
    ctx.beginPath();
    const d = 3 * bPulse;
    ctx.moveTo(f.x - d, f.y - d); ctx.lineTo(f.x + d, f.y + d);
    ctx.moveTo(f.x + d, f.y - d); ctx.lineTo(f.x - d, f.y + d);
    ctx.stroke();
    ctx.fillStyle = 'rgba(241,196,15,0.14)';
    ctx.beginPath(); ctx.arc(f.x, f.y, d * 1.8, 0, 6.283); ctx.fill();
  }
}

function drawMapFrame(now) {
  if (!baseImg) return;
  ctx.putImageData(buildFrame(now), 0, 0);
  updateClouds(); drawClouds();
  drawMapOverlays(now);
}

function mapFrame(now) {
  if (!mapPaused) drawMapFrame(now);
  mapRaf = requestAnimationFrame(mapFrame);
}

window.setMapAnimPaused = (v) => {
  mapPaused = !!v;
  if (!mapPaused) drawMapFrame(performance.now());
};

async function loadOverlays() {
  const r = await fetch('/api/overlays');
  const o = await r.json();
  mapOverlays = { capitals: o.capitals, sieges: o.sieges, armies: o.armies, fights: o.fights || [] };
  await loadMap();
  lastFights = o.fights || [];
  document.getElementById('bcount').textContent = lastFights.length;
}

async function loadState() {
  const r = await fetch('/api/state');
  const s = await r.json();
  const faiths = Object.entries(s.faiths).map(([k,v]) => k+':'+v).join('  ');
  document.getElementById('stats').textContent =
    `${s.date}   ${s.paused ? '⏸ paused' : '▶ ' + s.days_per_sec + ' days/s'}\n` +
    `Pawns: ${s.living_pawns}  (+${s.births} / −${s.deaths})\n` +
    `Kingdoms: ${s.kingdoms}   Wars: ${s.active_wars} active / ${s.total_wars} total\n` +
    `Faiths: ${faiths}\n` +
    `Innovations: ${s.innovations_known_all_realms}  Techniques: ${s.techniques_total}\n` +
    `Recipes: ${s.recipes_total}   LLM: ${s.llm_online ? 'online' : 'offline'}`;
  document.getElementById('pause').textContent = s.paused ? '▶ Resume' : '⏸ Pause';
}

async function loadChronicle() {
  const r = await fetch('/api/chronicle?since=' + chronTotal);
  const c = await r.json();
  if (!c.entries.length) return;
  chronTotal = c.total;
  const box = document.getElementById('chron');
  for (const e of c.entries) {
    const d = document.createElement('div');
    d.textContent = e;
    box.appendChild(d);
  }
  while (box.children.length > 400) box.removeChild(box.firstChild);
  box.scrollTop = box.scrollHeight;
}

// ---------- Total War battle viewer ----------
// The animated viewer lives in /battle.js (loaded below); it exposes
// window.openBattle(id) / window.closeBattle() and owns #bcanvas.
let lastFights = [];

// ---------- province + pawn inspector ----------
cv.addEventListener('click', async (ev) => {
  const rect = cv.getBoundingClientRect();
  const x = Math.floor((ev.clientX - rect.left) / rect.width * W);
  const y = Math.floor((ev.clientY - rect.top) / rect.height * H);
  // clicked near a live battle? open the battlefield
  for (const f of lastFights) {
    if (Math.hypot(f.x - x, f.y - y) < 3) {
      openBattle(f.id);
      return;
    }
  }
  const r = await fetch(`/api/province_xy?x=${x}&y=${y}`);
  const p = await r.json();
  if (!p || p.error) return;
  const goods = Object.entries(p.goods||{}).map(([g,v])=>`${g} ${v}`).join(', ');
  document.getElementById('prov').textContent =
    `${p.name} — ${p.biome}\nholding: ${p.holding} (fort ${p.fort}), dev ${p.development}\n` +
    `pop: ${p.population}   ruler: ${p.ruler || 'none'}\n` +
    `goods: ${goods || '—'}\nbuildings: ${(p.buildings||[]).join(', ') || '—'}`;
  document.getElementById('pawn').style.display = 'none';
  const pr = await fetch('/api/pawns?province=' + p.pid);
  const pd = await pr.json();
  const list = document.getElementById('pawnlist');
  list.innerHTML = '';
  for (const pw of pd.pawns || []) {
    const row = document.createElement('div');
    row.className = 'pawnrow';
    row.innerHTML = `${pw.is_ruler ? '◆ ' : ''}${pw.name} ` +
      `<span class="tag">${pw.age}y ${pw.job}` +
      `${pw.traits.length ? ' · ' + pw.traits.join(', ') : ''}</span>`;
    row.onclick = () => showPawn(pw.pid);
    list.appendChild(row);
  }
});

async function showPawn(pid) {
  const r = await fetch('/api/pawn?id=' + pid);
  const p = await r.json();
  if (!p) return;
  const el = document.getElementById('pawn');
  el.style.display = 'block';
  const skills = Object.entries(p.skills).map(([k,v])=>`${k} ${v}`).join('  ');
  const needs = Object.entries(p.needs).map(([k,v])=>`${k} ${v}`).join('  ');
  el.innerHTML =
    `<b>${p.name}</b>${p.house ? ' of House ' + p.house : ''} — ${p.age}y ` +
    `${p.female ? '♀' : '♂'} ${p.job}\n` +
    `faith: ${p.faith || '—'}   ambition: ${p.ambition}\n` +
    `personality: ${p.personality.join(', ')}\n` +
    `traits: ${p.traits_all.join(', ') || '—'}` +
    `${p.carriers.length ? '\ncarries: ' + p.carriers.join(', ') : ''}\n` +
    `${(p.wounds || []).length ? 'wounds: ' + p.wounds.join(', ') + '\n' : ''}` +
    `${skills}\nneeds: ${needs}\n` +
    `${p.techniques.length ? 'techniques: ' + p.techniques.join(', ') + '\n' : ''}` +
    `${p.spouse ? 'spouse: ' + p.spouse + '\n' : ''}` +
    `${p.children.length ? 'children: ' + p.children.join(', ') + '\n' : ''}` +
    `${p.titles.length ? 'titles: ' + p.titles.join('; ') + '\n' : ''}` +
    `${p.claims.length ? 'claims: ' + p.claims.join('; ') + '\n' : ''}` +
    `gold ${p.gold}  prestige ${p.prestige}  piety ${p.piety}`;
  const say = document.createElement('button');
  say.textContent = '💬 speak';
  say.style.marginTop = '6px';
  say.onclick = async () => {
    const rr = await fetch('/api/pawn_say?id=' + pid);
    const d = await rr.json();
    if (d.line) {
      const box = document.getElementById('chron');
      const div = document.createElement('div');
      div.textContent = d.line;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }
  };
  el.appendChild(document.createElement('br'));
  el.appendChild(say);
}

// ---------- controls ----------
document.querySelectorAll('button[data-mode]').forEach(b => {
  b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll('button[data-mode]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    loadOverlays();
  };
});
document.getElementById('pause').onclick = async () => {
  const s = await (await fetch('/api/state')).json();
  await fetch('/api/control', {method:'POST',
    body: JSON.stringify({action: s.paused ? 'resume' : 'pause'})});
  loadState();
};
document.getElementById('faster').onclick = async () => {
  const s = await (await fetch('/api/state')).json();
  await fetch('/api/control', {method:'POST',
    body: JSON.stringify({action:'speed', value: Math.min(120, s.days_per_sec * 1.5)})});
  loadState();
};
document.getElementById('slower').onclick = async () => {
  const s = await (await fetch('/api/state')).json();
  await fetch('/api/control', {method:'POST',
    body: JSON.stringify({action:'speed', value: Math.max(1, s.days_per_sec / 1.5)})});
  loadState();
};
document.getElementById('dlg').onclick = async () => {
  const r = await fetch('/api/dialogue');
  const d = await r.json();
  const box = document.getElementById('chron');
  for (const line of ['—— conversation ——', ...d.lines]) {
    const el = document.createElement('div');
    el.textContent = line;
    box.appendChild(el);
  }
  box.scrollTop = box.scrollHeight;
};

loadOverlays(); loadState(); loadChronicle();
setInterval(loadOverlays, 2000);
setInterval(loadState, 2000);
setInterval(loadChronicle, 1500);
requestAnimationFrame(mapFrame);
</script>
<script src="/battle.js"></script>
</body>
</html>
